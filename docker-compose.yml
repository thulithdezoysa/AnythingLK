version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ecommerce_db
    volumes:
      - db_data:/var/lib/mysql
      - ./anythinglk_db.sql:/docker-entrypoint-initdb.d/anythinglk_db.sql:ro
    ports:
      - "3306:3306"

  web:
    build: .
    depends_on:
      - db
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:cached
    environment:
      DB_HOST: db
      DB_NAME: ecommerce_db
      DB_USER: root
      DB_PASS: rootpassword

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    depends_on:
      - db
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "8081:80"

volumes:
  db_data:
