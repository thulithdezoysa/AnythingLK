<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" role="img" aria-label="Cash on Delivery">
  <rect width="200" height="80" rx="10" fill="#1e2533"/>
  <!-- Banknote -->
  <rect x="14" y="20" width="80" height="40" rx="5" fill="#27ae60"/>
  <ellipse cx="54" cy="40" rx="12" ry="12" fill="#2ecc71" opacity=".5"/>
  <ellipse cx="54" cy="40" rx="7" ry="7" fill="#fff" opacity=".9"/>
  <text x="54" y="44" text-anchor="middle" font-size="9" font-weight="bold" fill="#27ae60" font-family="Arial,sans-serif">Rs</text>
  <rect x="18" y="28" width="10" height="24" rx="2" fill="#2ecc71" opacity=".35"/>
  <rect x="76" y="28" width="10" height="24" rx="2" fill="#2ecc71" opacity=".35"/>
  <!-- COD label -->
  <text x="110" y="36" font-size="18" font-weight="bold" fill="#f0c040" font-family="Arial,sans-serif" letter-spacing="1">COD</text>
  <text x="110" y="54" font-size="9" fill="#8fa0b8" font-family="Arial,sans-serif">Cash on Delivery</text>
