      <stop offset="0%" style="stop-color:#6c3cf7"/>
      <stop offset="100%" style="stop-color:#d63af2"/>
    </linearGradient>
  </defs>
  <rect width="200" height="80" rx="10" fill="#0f0b1e"/>
