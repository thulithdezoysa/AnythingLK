  <!-- Secure badge -->
  <rect x="72" y="54" width="74" height="12" rx="3" fill="#6c3cf7" opacity=".35"/>
  <text x="109" y="63" text-anchor="middle" font-size="7.5" fill="#c8a0f8" font-family="Arial,sans-serif" letter-spacing="1">SECURE PAY</text>
